services:
  neo4j:
    image: neo4j:5.24-community
    container_name: neo4j-movies
    ports:
      - "7474:7474"   # Neo4j Browser (web UI)
      - "7687:7687"   # Bolt (Python driver)
    environment:
      - NEO4J_AUTH=neo4j/neo4j_pass_123
      - NEO4J_server_memory_heap_max__size=1G
    volumes:
      - neo4j_data:/data
volumes:
  neo4j_data:
